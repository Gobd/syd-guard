<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sydguard</title>
<style>
  :root { color-scheme: light dark; --bg:#fafafa; --card:#fff; --fg:#1d1d1f; --mute:#6e6e73; --line:#e3e3e8; --accent:#0a66ff; --warn:#c2410c; --ok:#15803d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --card:#1b1c1f; --fg:#ececf1; --mute:#9a9aa3; --line:#2c2d32; --accent:#5b9bff; --warn:#fb923c; --ok:#4ade80; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:baseline; gap:12px; padding:14px 24px; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; }
  main { max-width:1150px; margin:0 auto; padding:16px 24px 64px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:28px 0 10px; display:flex; gap:10px; align-items:center; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .pill { font:600 11px ui-monospace, monospace; padding:2px 7px; border-radius:5px; background:var(--line); text-transform:uppercase; }
  .pill.write, .pill.connect, .pill.unknown, .pill.learning { background:color-mix(in srgb, var(--warn) 25%, transparent); }
  .pill.hosts { background:color-mix(in srgb, var(--accent) 22%, transparent); }
  .pill.applied { background:color-mix(in srgb, var(--ok) 22%, transparent); }
  .target { font:13px ui-monospace, monospace; word-break:break-all; }
  .mute { color:var(--mute); } .small { font-size:12px; }
  .warn { color:var(--warn); } .ok { color:var(--ok); }
  input[type=text], select { font:13px ui-monospace, monospace; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  input[type=text] { flex:1; min-width:260px; }
  button { font:inherit; font-size:13px; padding:5px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.link { border:none; background:none; color:var(--mute); padding:2px 6px; }
  button.link:hover { color:var(--warn); }
  .opts { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .opts button { font:12px ui-monospace, monospace; padding:3px 8px; }
  .opts button.sel { border-color:var(--accent); color:var(--accent); }
  .rules { display:grid; grid-template-columns: repeat(auto-fit, minmax(230px,1fr)); gap:10px; margin-top:8px; }
  .rules ul { list-style:none; margin:4px 0 6px; padding:0; }
  .rules li { display:flex; justify-content:space-between; gap:6px; font:12.5px ui-monospace, monospace; padding:2px 0; word-break:break-all; }
  .rules h4 { margin:0; font-size:12px; color:var(--mute); text-transform:uppercase; }
  .add { display:flex; gap:4px; } .add input { min-width:0; font-size:12px; }
  .empty { color:var(--mute); padding:8px 2px; }
  pre { font:12px ui-monospace, monospace; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px; overflow:auto; max-height:240px; }
  #toast { white-space:pre-wrap; }
  details summary { cursor:pointer; color:var(--mute); font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<header><h1>sydguard</h1><span class="mute small" id="status">connecting…</span></header>
<main>
  <div id="toast" class="small"></div>
  <h2>Waiting for you <span id="pendingCount"></span></h2>
  <div id="pending"></div>
  <h2>Learning now <span class="mute small" style="text-transform:none">(saved to the rules file when the learn run exits)</span> <span id="learnedActions"></span></h2>
  <div id="learned"></div>
  <h2>Running agents</h2>
  <div id="sessions"></div>
  <h2>Rules</h2>
  <div id="rules"></div>
</main>
<script>
const token = (() => {
  if (location.hash.length > 1) { localStorage.setItem("sydguard-token", location.hash.slice(1)); history.replaceState(null, "", "/"); }
  return localStorage.getItem("sydguard-token") || "";
})();
const $ = (id) => document.getElementById(id);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k.startsWith("on") ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k);
  return e;
};
async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.error) || r.statusText);
  return j;
}
// Report exactly what happened: saved, and applied live (or not) per session.
function describe(res) {
  if (!res) return "";
  const lines = [];
  const add = (list, vm) => (list || []).forEach((s) => lines.push(s.applied ? `✓ applied live to ${vm ? vm + " " : ""}session ${s.session.slice(0, 6)}` : `✗ NOT applied to ${vm ? vm + " " : ""}session ${s.session.slice(0, 6)}: ${s.error}`));
  if (res.saved) lines.unshift("saved to " + short(res.saved));
  add(res.sessions);
  for (const [vm, r] of Object.entries(res.vms || {})) r.error ? lines.push(`✗ ${vm}: ${r.error}`) : add(r.sessions, vm);
  if (res.note) lines.push("note: " + res.note);
  return lines.join("\n");
}
async function act(path, body) {
  try { const res = await api(path, body); $("toast").className = "small ok"; $("toast").textContent = describe(res); }
  catch (e) { $("toast").className = "small warn"; $("toast").textContent = e.message; }
  refresh();
}
const short = (p) => (p || "").replace(/^\/(home|Users)\/[^/]+/, "~");
const base = (p) => short(p).split("/").slice(-2).join("/");
const KIND = { read: "read", write: "write", hosts: "web", connect: "connect" };

const choice = {}; // per-card selections survive re-renders
function cardView(vm, c) {
  const st = choice[c.id] ||= { pattern: c.options[0], kind: c.kind, scope: "rules" };
  const opts = h("div", { class: "opts" }, c.options.map((o) => h("button", { class: o === st.pattern ? "sel" : "", onclick: () => { st.pattern = o; render(); } }, short(o))));
  const input = h("input", { type: "text", value: st.pattern, oninput: (e) => (st.pattern = e.target.value) });
  const sel = (vals, cur, on) => h("select", { onchange: (e) => on(e.target.value) }, vals.map(([v, l]) => { const o = h("option", { value: v }, l); if (v === cur) o.selected = true; return o; }));
  const kindSel = (c.kind === "read" || c.kind === "write") ? sel([["read", "read"], ["write", "read+write"]], st.kind, (v) => (st.kind = v)) : null;
  const scopeSel = sel([["rules", "this rules file (" + base(c.rulesFile) + ")"], ["global", "all projects"]], st.scope, (v) => (st.scope = v));
  const body = { vm, card: c.id, scope: st.scope, file: c.rulesFile };
  return h("div", { class: "card" },
    h("div", { class: "row" },
      h("span", { class: "pill " + c.kind }, KIND[c.kind]),
      h("span", { class: "target" }, short(c.target)),
      c.count > 1 ? h("span", { class: "mute small" }, "×" + c.count) : null,
      c.waiting ? h("span", { class: "warn small" }, `⏸ ${c.waiting} request${c.waiting > 1 ? "s" : ""} paused`) : null),
    h("div", { class: "mute small" }, `${vm} › ${short(c.project)} › ${base(c.rulesFile)}`, c.cmd ? " · " + c.cmd : ""),
    c.note ? h("div", { class: "small mute" }, c.note) : null,
    opts,
    h("div", { class: "row" }, input, kindSel, scopeSel,
      h("button", { class: "primary", onclick: () => act("/api/allow", { ...body, kind: st.kind, pattern: st.pattern }) }, "Allow"),
      h("button", { onclick: () => act("/api/dismiss", { vm, card: c.id }) }, c.learned ? "Skip" : "Deny"),
      h("button", { class: "link", title: "deny and never ask again", onclick: () => act("/api/allow", { ...body, kind: "ignore", pattern: c.kind === "hosts" ? c.target.replace(/^[a-z]+:\/\//, "").replace(/:\d+$/, "") : st.pattern }) }, "deny always")));
}

function rulesView(title, vm, scope, f, extra) {
  const rules = f.rules || {};
  const block = (kind, label, placeholder) => {
    let val = "";
    const add = () => val && act("/api/allow", { vm, scope, file: f.path, kind, pattern: val });
    return h("div", {},
      h("h4", {}, label),
      h("ul", {}, (rules[kind] || []).map((p) => h("li", {}, h("span", {}, short(p)), h("button", { class: "link", title: "remove", onclick: () => act("/api/remove", { vm, scope, file: f.path, kind, pattern: p }) }, "✕")))),
      h("div", { class: "add" }, h("input", { type: "text", placeholder, oninput: (e) => (val = e.target.value), onkeydown: (e) => e.key === "Enter" && add() }), h("button", { onclick: add }, "+")));
  };
  return h("div", { class: "card" },
    h("div", { class: "row" }, h("strong", {}, title), h("span", { class: "mute small" }, short(f.path)), extra),
    f.error ? h("div", { class: "warn small" }, "⚠ " + f.error + " — using the last trusted rules") : null,
    f.pending ? h("div", {}, h("div", { class: "warn small" }, "⚠ changed outside sydguard — not in use until you trust it:"), h("pre", {}, f.pending),
      h("button", { onclick: () => act("/api/trust", { vm, scope, file: f.path }) }, "Trust these rules")) : null,
    h("div", { class: "rules" },
      block("read", "Read", "~/.cache/go-build/**"),
      block("write", "Read + write", "~/.npm/**"),
      block("hosts", "Web (by host name)", "https://github.com, *.npmjs.org"),
      block("connect", "Raw connect (advanced)", "1.2.3.4!22"),
      block("ignore", "Always deny", "host or path")),
    f.baseline ? h("details", {}, h("summary", {}, "always allowed (built in)"),
      h("ul", { class: "small mute" }, f.baseline.map((b) => h("li", {}, `${b.kind} ${short(b.pattern)} — ${b.why}`)))) : null);
}

let last = null;
function render() {
  const s = last; if (!s) return;
  const all = [], sessions = [], files = [];
  for (const vm of s.vms) {
    const st = vm.state; if (!st) continue;
    for (const c of st.cards) all.push([vm.name, c]);
    for (const x of st.sessions) sessions.push([vm.name, x]);
    for (const f of st.files) files.push([vm.name, f]);
  }
  const pending = all.filter(([, c]) => !c.learned), learned = all.filter(([, c]) => c.learned);
  document.title = (pending.length ? `(${pending.length}) ` : "") + "sydguard";
  $("pendingCount").textContent = pending.length ? `(${pending.length})` : "";
  $("pending").replaceChildren(...(pending.length ? pending.map(([vm, c]) => cardView(vm, c)) : [h("div", { class: "empty" }, "Nothing blocked right now.")]));
  $("learned").replaceChildren(...(learned.length ? learned.map(([vm, c]) => cardView(vm, c)) : [h("div", { class: "empty" }, "Run sydguard --learn -- <agent> to record rules automatically.")]));
  $("learnedActions").replaceChildren();
  const vmErrors = s.vms.filter((v) => !v.ok).map((v) => h("div", { class: "card small warn" }, `${v.name}: ${v.error || "not connected"}`));
  $("sessions").replaceChildren(...vmErrors, ...(sessions.length ? sessions.map(([vm, x]) => h("div", { class: "card" },
    h("div", { class: "row" },
      h("span", { class: "pill " + (x.learn ? "learning" : x.status) }, x.learn ? "learning" : x.status),
      h("span", { class: "target" }, x.cmd.join(" ")),
      h("span", { class: "mute small" }, `${vm} › ${short(x.cwd)} · rules ${base(x.rulesFile)} · pid ${x.pid} · since ${new Date(x.started).toLocaleTimeString()}`)),
    x.lastError ? h("div", { class: "warn small" }, "last update failed: " + x.lastError + " — policy state unknown; restart this agent") : null))
    : [h("div", { class: "empty" }, "No agents running.")]));
  const views = [];
  if (s.ownsGlobal && s.global) views.push(rulesView("All projects (every VM)", "", "global", s.global));
  for (const vm of s.vms) if (!s.ownsGlobal && vm.state) views.push(rulesView("All projects", vm.name, "global", vm.state.global));
  for (const [vm, f] of files) views.push(rulesView(`${vm} › ${short(f.project) || "rules"}`, vm, "rules", f,
    f.sessions.length ? h("span", { class: "pill applied" }, `${f.sessions.length} running`) : null));
  $("rules").replaceChildren(...views);
}
async function refresh() {
  try {
    const s = await api("/api/state");
    const ok = s.vms.filter((v) => v.ok).map((v) => v.name);
    $("status").textContent = `UI ${s.version} · ${ok.length ? "connected: " + ok.join(", ") : "no VMs connected"}`;
    const sig = JSON.stringify(s);
    if (sig !== JSON.stringify(last)) {
      last = s;
      const focused = document.activeElement && ["INPUT", "SELECT"].includes(document.activeElement.tagName);
      if (!focused) render();
    }
  } catch (e) { $("status").textContent = token ? "disconnected: " + e.message : "missing token — run `sydguard ui`"; }
}
refresh(); setInterval(refresh, 1000);
</script>
</body>
</html>
